name: Fortran network

on: [pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get -qq -y install curl g++ gfortran
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pynucastro
        run: pip install .

      - name: Build the network
        run: |
          mkdir work
          cd work
          cp ../.github/workflows/fortran_network/* .
          python test_fortran.py
          make

      - name: Run and compare
        run: |
          cd work
          ./test 2.e8 4.e9 > test.out
          diff test.out fortran_net.out
