name: linkcheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pandoc and doxygen
        run: |
          sudo apt install pandoc doxygen

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Install dependencies
        run: |
          pip install -r ./requirements.txt
          pip install -r ./requirements-docs.txt

      - name: Install pynucastro
        run: pip install .

      - name: Check links
        run: |
          cd docs/
          make SPHINXOPTS=-v SKIP_EXECUTE=TRUE linkcheck

      - name: Upload linkcheck report
        uses: actions/upload-artifact@v7
        with:
          name: linkcheck-output
          path: docs/build/linkcheck/output.txt
          archive: false

